name: Keep Vercel & DB Alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API & Website để giữ serverless và database luôn "ấm"
        run: |
          echo "Đang ping lúc $(date)"
          curl -sSL -o /dev/null -w "Products API Status: %{http_code} | Thời gian: %{time_total}s\n" \
            --max-time 30 \
            https://cuahanghuutanh.vercel.app/api/products
          curl -sSL -o /dev/null -w "Slides API Status: %{http_code} | Thời gian: %{time_total}s\n" \
            --max-time 30 \
            https://cuahanghuutanh.vercel.app/api/slides
          curl -sSL -o /dev/null -w "Homepage Status: %{http_code} | Thời gian: %{time_total}s\n" \
            --max-time 30 \
            https://cuahanghuutanh.vercel.app/

