name: Keep Vercel App Alive   # đổi tên cho đúng, không còn liên quan Azure
on:
  schedule:
    - cron: '*/10 * * * *'    # có thể tăng lên 10 phút/lần cho chắc
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping website để giữ app luôn "thức"
        run: |
          echo "Đang ping https://cuahanghuutanh.vercel.app/ lúc $(date)"
          curl -sSL -o /dev/null -w "HTTP Status: %{http_code} | Thời gian phản hồi: %{time_total}s\n" \
            --max-time 60 \
            https://cuahanghuutanh.vercel.app/
